# PostgreSQL local para desarrollo:  docker compose up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: cambia_esta_clave   # debe coincidir con DB_PASSWORD de backend/.env
      POSTGRES_DB: crowdfunding_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
